name: Release

# 推送形如 vX.Y.Z 如 v0.3.0 的 tag 时自动发版：
#   凭 tag 号更新 package.json 版本并提交回 master → 测试 → 构建 → 发布 npm
#   → 生成 GitHub Release draft。人只需打一个 tag，其余自动衔接。
# 注意：npm 发布依赖仓库设置的 Secrets → NPM_TOKEN，未配置时发布步骤会失败。
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }} to npm
    runs-on: ubuntu-latest
    # id-token: write 供 Trusted Publishing 换取 npm 临时凭证，无需 NPM_TOKEN。
    # 必须放在 job 级，GitHub 才会向该 job 注入 ACTIONS_ID_TOKEN_REQUEST_*。
    permissions:
      contents: write
      id-token: write
    # fork 永不触发 tag 发布，仅作为兜底防护。
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 回写 master 需要完整历史，故拉全量。
          fetch-depth: 0
          # 默认 GITHUB_TOKEN 在分支保护下会被拒，此处显式传 token。
          token: ${{ secrets.GITHUB_TOKEN }}

      # 版本号仅凭 tag 号决定，写入 package.json 并提交回 master。
      - name: Sync version to master
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"          # 去 v 前缀得版本号，如 0.3.0
          echo "target version = $TAG"

          # 切到 master 分支再改版本，避免在 detached tag 上提交。
          git checkout master
          git config user.name  github-actions[bot]
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用临时文件改写 version 字段，保留其余内容不变。
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = process.argv[1];
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          " "$TAG"

          # 已是最新版本则无改动，跳过提交；否则提交并推回 master。
          git diff --quiet package.json || {
            git add package.json
            git commit -m "chore: release $TAG 同步 package.json 版本 [skip ci]"
            git push origin master
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 诊断：确认 Trusted Publishing 的 OIDC 令牌已注入（若为空说明 id-token 未生效）。
      - name: Check OIDC token presence
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC URL: present (${ACTIONS_ID_TOKEN_REQUEST_URL}?audience=dsh)"
            echo "OIDC token: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r 'if .value then "OIDC id_token length: " + (.value|length|tostring) else "fetch-error: " + (.message // "unknown") end'
          else
            echo "OIDC: MISSING — id-token: write not injected; will fall back to unauth (ENEEDAUTH)"
          fi
        shell: bash

      # Trusted Publishing：npm 凭 workflow 的 OIDC 身份直接授权，
      # 无需 NPM_TOKEN；--provenance 会在 npm 上附构建来源证明。
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true