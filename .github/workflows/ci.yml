name: CI

# 每次 push 到主分支、以及任何 PR 包括来自 fork 的 PR 都自动跑完整检查。
# PR 检查即「PR 通过的门禁」：typecheck / test / build 三者全绿才允许合并。
on:
  push:
    branches:
      - main
  pull_request:
    # fork PR 也可触发；此工作流不读写仓库 secrets，fork 环境下安全。
    branches:
      - main

# 同一分支/PR 上排队的新提交会取消正在跑的旧任务，避免资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 版本必须与 package.json 的 packageManager 完全一致，否则 action-setup 会报 Multiple versions of pnpm specified。
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.3.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 让 PR 作者与评审一眼看到构建产物是否齐全，产物缺失会在此失败。
      # 注意 client.tsdown 配置 dts:false，因此只产出 client.js，不产出 client.d.ts。
      - name: Verify build outputs
        run: |
          test -f lib/index.js
          test -f lib/client.js
          test -f lib/index.d.ts
          test -f cordis.patch.yml
          echo "构建产物齐全：lib/index.js · lib/client.js · lib/index.d.ts · cordis.patch.yml"